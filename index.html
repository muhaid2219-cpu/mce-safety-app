<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#14335c" />
  <title>محضر مخالفة سلامة للمقاولين - شركة المحايد</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- شريط حالة الاتصال والنظام -->
  <header class="top-status-bar">
    <div id="connectionStatusBadge" class="status-pill is-online">
      متصل بالإنترنت
    </div>
    <button type="button" id="refreshSettingsBtn" class="btn-refresh-settings">
      تحديث الإعدادات من الخادم
    </button>
  </header>

  <main class="app-container">

    <!-- ترويسة الشركة السعودية للكهرباء وشركة المحايد -->
    <section class="corporate-header" aria-label="ترويسة النموذج">
      <div class="logo-box">
        <img id="companyLogoImg" src="" alt="شعار السعودية للطاقة" style="display:none;" />
        <div id="companyLogoPlaceholder" class="logo-placeholder">شعار السعودية للطاقة</div>
      </div>

      <div class="header-titles">
        <p id="headerCompanyName" class="header-owner-name">الشركة السعودية للكهرباء (السعودية للطاقة)</p>
        <h1 id="headerConsultingName" class="header-consultant-name">شركة المحايد مهندسون استشاريون</h1>
        <div id="headerFormTitle" class="header-form-title">محضر مخالفة سلامة للمقاولين</div>
      </div>

      <div class="logo-box">
        <img id="consultingLogoImg" src="" alt="شعار شركة المحايد" style="display:none;" />
        <div id="consultingLogoPlaceholder" class="logo-placeholder">شعار شركة المحايد</div>
      </div>
    </section>

    <!-- أزرار التنقل بين النموذج والطابور المحلي -->
    <nav class="view-tabs" aria-label="التنقل">
      <button type="button" id="tabNewViolation" class="tab-btn active" data-target="newViolationPanel">
        تسجيل مخالفة جديدة
      </button>
      <button type="button" id="tabLocalQueue" class="tab-btn" data-target="localQueuePanel">
        الإرسالات المحفوظة محلياً
        <span id="queueCountBadge" class="tab-badge">0</span>
      </button>
    </nav>

    <!-- شريط التنبيهات العام -->
    <div id="globalAlertBanner" class="alert-banner" role="alert"></div>

    <!-- ==================== لوحة تسجيل مخالفة جديدة ==================== -->
    <section id="newViolationPanel">
      <form id="violationForm" novalidate>

        <!-- القسم 1: المعلومات العامة -->
        <div class="form-section-card">
          <div class="section-header">
            <span class="section-number">1</span>
            <h2 class="section-title">المعلومات العامة للمخالفة</h2>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="department">
                الإدارة <span class="required-star">*</span>
              </label>
              <input type="text" id="department" name="department" class="form-control" value="الدمام" readonly />
              <span class="field-error" id="err-department"></span>
            </div>

            <div class="form-group">
              <label class="form-label" for="district">
                الدائرة <span class="required-star">*</span>
              </label>
              <select id="district" name="district" class="form-control" required>
                <option value="">-- جارٍ تحميل الدوائر... --</option>
              </select>
              <span class="field-error" id="err-district"></span>
            </div>

            <div class="form-group full-width">
              <label class="form-label" for="location">
                الموقع <span class="required-star">*</span>
              </label>
              <input type="text" id="location" name="location" class="form-control" placeholder="اكتب اسم الموقع أو الحي أو رقم المحطة / المسار" required />
              <span class="field-error" id="err-location"></span>
            </div>

            <div class="form-group">
              <label class="form-label" for="violationDate">
                التاريخ <span class="required-star">*</span>
              </label>
              <input type="date" id="violationDate" name="violationDate" class="form-control" required />
              <span class="field-error" id="err-violationDate"></span>
            </div>

            <div class="form-group">
              <label class="form-label" for="violationTime">
                الوقت <span class="required-star">*</span>
              </label>
              <input type="time" id="violationTime" name="violationTime" class="form-control" required />
